name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const regex = new RegExp(`^${yy}\\.([0-9]+)$`);
            let max = 0;
            for (const tag of tags) {
              const match = tag.name.match(regex);
              if (match) {
                const n = parseInt(match[1], 10);
                if (!Number.isNaN(n)) {
                  max = Math.max(max, n);
                }
              }
            }
            const next = max + 1;
            const nextTag = `${yy}.${next}`;
            core.info(`Next tag: ${nextTag}`);
            const exists = tags.some((t) => t.name === nextTag);
            if (!exists) {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${nextTag}`,
                sha: context.sha,
              });
            }
            core.setOutput("tag", nextTag);

  native:
    runs-on: ubuntu-latest
    needs: tag
    env:
      ECHIDNA_VERSION: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure and Build Native
        run: |
          # Собираем DSP
          cmake -S native/dsp -B build/dsp -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26
          cmake --build build/dsp --config Release
          
          # Собираем Zygisk модуль
          cmake -S native/zygisk -B build/zygisk -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26
          cmake --build build/zygisk --config Release

      - name: Package Magisk module
        run: |
          mkdir -p artifacts/native
          cp build/dsp/lib/arm64-v8a/libech_dsp.so artifacts/native/libech_dsp.so
          cp build/zygisk/lib/libechidna.so artifacts/native/libechidna.so
          bash tools/build_magisk_module.sh
          mkdir -p artifacts/magisk
          cp out/echidna-magisk.zip artifacts/magisk/echidna-magisk.zip

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: artifacts/magisk/echidna-magisk.zip

  android:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (Companion App)
        run: ./gradlew assembleDebug
        working-directory: android/app

      - name: Collect APK
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apk/Echidna-Companion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-app
          path: artifacts/apk/Echidna-Companion.apk

  publish:
    runs-on: ubuntu-latest
    needs: [tag, native, android]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Echidna ${{ needs.tag.outputs.tag }}
          files: |
            release_artifacts/magisk-module/echidna-magisk.zip
            release_artifacts/companion-app/Echidna-Companion.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
